services:
  db:
    image: postgres:17
    container_name: resqnet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resqnet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resqnet"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resqnet-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resqnet-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/resqnet
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy
    networks:
      - resqnet-network

volumes:
  postgres_data:
    driver: local

networks:
  resqnet-network:
    driver: bridge
